# yaml-language-server: $schema=https://www.schemastore.org/github-issue-config.json
# SUZURI: Suzuri's own issue chooser. Zed's templates and links point at
# zed-industries/zed, so Zed's 10_/11_ templates are deleted; keep them deleted on merge.
blank_issues_enabled: false
contact_links:
  - name: Suzuri documentation
    url: https://docs.suzuri.ai/
    about: Guides for live preview, citations, typesetting and the PDF viewer.
  - name: A bug that also happens in Zed
    url: https://docs.suzuri.ai/relationship-to-zed
    about: Suzuri is built on Zed. A problem that also happens in a clean Zed install belongs in Zed's issue tracker.
