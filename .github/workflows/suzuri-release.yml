# Suzuri's release pipeline (AgentFit-style): push a `suzuri-v*` tag and a
# GitHub Release appears with macOS DMGs (both architectures), a Windows
# installer, and Linux tarballs (both architectures). Deliberately separate
# from Zed's own release.yml, which targets Namespace runners this fork does
# not have.
#
# macOS builds sign and notarize automatically when the repo has the same
# five secrets AgentFit's release flow uses: CERTIFICATE_P12,
# CERTIFICATE_PASSWORD (Developer ID .p12, base64), APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID. Without them the build falls
# back to ad-hoc signing (right-click → Open). Windows signing uses the
# Azure Trusted Signing variables listed in bundle-windows.ps1.
name: Suzuri Release

on:
  push:
    tags:
      - "suzuri-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The version a build reports at runtime is SUZURI_VERSION, compiled in, and
  # it is what suzuri_update compares against the newest GitHub release. A tag
  # that runs ahead of the constant ships a build that never learns it is out of
  # date, so refuse to build one — in seconds, rather than after three hours of
  # compilation.
  #
  # Note this is NOT crates/zed/Cargo.toml's version: that one is upstream Zed's,
  # and every upstream merge moves it.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compare tag with SUZURI_VERSION
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Not a tag build; skipping the version check."
            exit 0
          fi
          source_file=crates/suzuri_update/src/suzuri_update.rs
          tag_version="${GITHUB_REF_NAME#suzuri-v}"
          code_version=$(sed -n 's/^pub const SUZURI_VERSION: &str = "\(.*\)";$/\1/p' "$source_file")
          if [ -z "${code_version}" ]; then
            echo "::error::Could not read SUZURI_VERSION out of ${source_file}."
            exit 1
          fi
          if [ "${tag_version}" != "${code_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match SUZURI_VERSION ${code_version} in ${source_file}."
            echo "Bump the constant (or retag) so the shipped build reports the version it was released as."
            exit 1
          fi
          echo "Tag and SUZURI_VERSION agree: ${code_version}"

  build-mac:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.target }}
          # These builds run long enough that a timeout or a late failure
          # would otherwise throw away hours of compilation.
          cache-on-failure: true

      - name: Report disk space
        run: df -h /

      - name: Build DMG
        env:
          MACOS_CERTIFICATE: ${{ secrets.CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./script/bundle-mac ${{ matrix.target }}

      - name: Rename artifact
        run: |
          arch="${{ matrix.target }}"
          arch="${arch%%-*}"
          mv "target/${{ matrix.target }}/release/Zed-${arch}.dmg" \
             "target/${{ matrix.target }}/release/suzuri-${arch}.dmg"

      - uses: actions/upload-artifact@v6
        with:
          name: dmg-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/suzuri-*.dmg

  build-windows:
    needs: check-version
    # windows-2022 specifically: it ships ISCC (Inno Setup) on PATH, which
    # bundle-windows.ps1 relies on; windows-2025 images currently do not.
    runs-on: windows-2022
    # A cold-cache Rust build of the whole workspace runs past three hours
    # on hosted Windows runners.
    timeout-minutes: 350
    env:
      ZED_WORKSPACE: ${{ github.workspace }}
      # Shrink the target dir to fit hosted-runner disks; users don't need
      # debug info in a release installer anyway.
      CARGO_PROFILE_RELEASE_DEBUG: "false"
    steps:
      - uses: actions/checkout@v5

      - name: Derive version from tag
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -like 'suzuri-v*') {
            $env:GITHUB_REF_NAME -replace '^suzuri-v', ''
          } else {
            "0.0.0-manual"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Cargo's libgit2 checks out git dependencies under CARGO_HOME, and the
      # `pet` crate's conda test fixtures blow past Windows' 260-character
      # MAX_PATH there. Zed builds Windows on self-hosted runners that already
      # have long paths enabled; GitHub-hosted ones need both switches.
      - name: Enable long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null

      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle-windows
          cache-on-failure: true

      - name: Report disk space
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem

      - name: Build installer
        shell: pwsh
        run: ./script/bundle-windows.ps1

      - uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: target/suzuri-windows-x86_64.exe

  build-linux:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest hosted image still offered. The tarball links against
          # the builder's glibc, so a newer image would shut out users on
          # older distributions; Zed builds on 20.04 for the same reason.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      CC: clang
      CXX: clang++
      # bundle-linux strips debug info anyway; not generating it keeps the
      # target dir within a hosted runner's disk.
      CARGO_PROFILE_RELEASE_DEBUG: "false"
    steps:
      - uses: actions/checkout@v5

      # Hosted Ubuntu images leave roughly 20G free, and a release build of
      # the workspace needs more. Toolchains nothing here uses are the
      # cheapest space to reclaim.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: ./script/linux

      # The prebuilt libwebrtc archive contains SME-enabled libyuv routines
      # (rotate_sme.o) that call __arm_tpidr2_save, a helper only GCC 14+
      # libgcc or LLVM 17+ compiler-rt provide. Zed's own ARM builds get it
      # from a newer libgcc_s their runner image carries; this runner's GCC 11
      # has no such symbol, so the link fails. Appending compiler-rt's
      # builtins archive resolves it statically, adding no runtime dependency
      # to the tarball. bundle-linux keeps whatever RUSTFLAGS it inherits.
      # LLVM 19 specifically: apt.llvm.org's 18 packages for jammy were built
      # without the SME routines, so the nm check below guards the version.
      - name: Provide SME helpers from compiler-rt
        if: matrix.arch == 'aarch64'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main" | sudo tee /etc/apt/sources.list.d/llvm-19.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y libclang-rt-19-dev
          builtins=$(find /usr/lib/llvm-19 -name 'libclang_rt.builtins*.a' | head -n 1)
          if [ -z "${builtins}" ] || ! nm "${builtins}" | grep -q __arm_tpidr2_save; then
            echo "::error::No compiler-rt builtins archive defining __arm_tpidr2_save under /usr/lib/llvm-19."
            exit 1
          fi
          echo "Linking with ${builtins}"
          echo "RUSTFLAGS=-C link-arg=${builtins}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle-linux-${{ matrix.arch }}
          cache-on-failure: true

      - name: Build tarball
        run: ./script/bundle-linux

      - uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.arch }}
          path: target/release/suzuri-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
