<!--
  Suzuri app icon for Linux and Windows: the master mark
  (assets/images/suzuri_logo.svg) on a cream rounded tile (824 px square,
  185.4 px corners, centred on a 1024 canvas), transparent outside it. These
  platforms draw the icon as-is, so the margin must be transparent. The macOS
  bundle uses app-icon-suzuri-macos.svg instead; see why there.

  Regenerate app-icon-suzuri.png (512), app-icon-suzuri@2x.png (1024), and
  windows/app-icon-suzuri.ico (16, 32, 48, 256) from this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="#EFE6D5"/>
  <g transform="translate(512 512) scale(10.56) translate(-30.5 -32)">
    <path fill="#17130F" fill-rule="evenodd" d="M30 7.5C41.5 7.5 50.5 16.5 53.5 27.5C56 36 55.5 45.5 48.5 51C42.5 55.8 32 57 22.5 55.2C13.5 53.4 7.5 46.5 7.5 36.5C7.5 25.5 11.5 15 19.5 10.3C23 8.2 26.5 7.5 30 7.5 ZM35 19.8C40.8 19.8 45.3 24.2 45.3 29.8C45.3 35.6 40.6 40.4 34.8 40.2C29.3 40 24.9 35.5 25 30C25.1 24.4 29.2 19.8 35 19.8 Z"/>
  </g>
</svg>
