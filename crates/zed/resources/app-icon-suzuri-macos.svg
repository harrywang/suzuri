<!--
  Suzuri app icon for the macOS bundle: app-icon-suzuri.svg with the cream
  tile filling the whole canvas. macOS clips an opaque icon to its own tile
  shape and draws it flat. An icon that already fits Apple's tile grid with a
  transparent margin is instead treated as a legacy icon and gets the system's
  glass shading, which turns the flat pebble into a soft grey gradient.
  Linux and Windows do not clip, so they keep app-icon-suzuri.svg.

  Regenerate app-icon-suzuri-macos.png (512) and @2x (1024) from this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#EFE6D5"/>
  <g transform="translate(512 512) scale(13.12) translate(-30.5 -32)">
